# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: blank # the website title (if blank, full name will be used instead)
first_name: Minggui
middle_name:
last_name: Teng
chinese_name: 滕明桂
email: minggui_teng@pku.edu.cn
description: > # the ">" symbol means to ignore newlines until "footer_text:"
  Academic pages for Minggui Teng 
footer_text:
  Powered by <a href="http://jekyllrb.com/" target="_blank">Jekyll</a>.

icon: 🎓 # the emoji used as the favicon
url: https://tengminggui.cn # the base hostname & protocol for your site
baseurl: "" # empty for root domain
last_updated: true # set to true if you want to display last updated in the footer
impressum_path:  # set to path to include impressum link in the footer, use the same path as permalink in a page, helps to conform with EU GDPR

# -----------------------------------------------------------------------------
# RSS Feed
# -----------------------------------------------------------------------------
# will use title and url fields
# Take a look to https://github.com/jekyll/jekyll-feed for more customization

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: true

# Dimensions
max_width: 800px

# TODO: add layout settings (single page vs. multi-page)

# -----------------------------------------------------------------------------
# Open Graph
# -----------------------------------------------------------------------------
# Display links to the page with a preview object on social media.
serve_og_meta: true # Include Open Graph meta tags in the HTML head
og_image: /assets/img/og-image.jpg # The site-wide (default for all links) Open Graph preview image

# -----------------------------------------------------------------------------
# Social integration
# -----------------------------------------------------------------------------

github_username: ChipsAhoyM # your GitHub user name
gitlab_username: # your GitLab user name
twitter_username: # your Twitter handle
linkedin_username: # your LinkedIn user name
scholar_userid: BukbqcwAAAAJ # your Google Scholar ID
orcid_id: 0000-0002-9234-4243 # your ORCID ID
semanticscholar_userid: 1557343782 # your Semantic Scholar author ID
medium_username: # your Medium username
quora_username: # your Quora username
publons_id: # your ID on Publons
research_gate_profile: # your profile on ResearchGate
blogger_url: # your blogger URL
work_url: # work page URL
keybase_username: # your keybase user name
wikidata_id: # your wikidata id
dblp_url: # your DBLP profile url (e.g. https://dblp.org/pid/xx/xxxx) - resolved automatically by the bib sync action
stackoverflow_id: #your stackoverflow id
instagram_id: teddy.teng.99 # your instagram id
rednote_url: https://xhslink.com/m/A2QdHAxHbCs # your Xiaohongshu (小红书) profile URL

# contact_note: 
#   Email is usually the best way to reach me.

# Analytics are disabled (enable_google_analytics / enable_panelbear_analytics are false).
# If you enable them later, use a current GA4 measurement id (the old UA-... format is retired).
# google_analytics: G-XXXXXXXXXX # out your GA4 measurement id
# panelbear_analytics: XXXXXXXXX # panelbear analytics site ID

# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------
# The blog section was removed; re-add a _posts directory and uncomment
# jekyll-paginate-v2 (Gemfile + plugins) if you want to start blogging.
# blog_name: My blog
# blog_description: to be done
# permalink: /blog/:year/:title/

# Comments
# disqus_shortname: al-folio # put your disqus shortname
# https://help.disqus.com/en/articles/1717111-what-s-a-shortname

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  news:
    output: true
    permalink: /news/:path/

defaults:
  - scope:
      path: ""
      type: news
    values:
      layout: post

news_limit: 5

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

# Markdown and syntax highlight
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# Includes & excludes
include: ['_pages']  # required: pages in _pages/ are only processed when listed here
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - LICENSE
keep_files:
  - CNAME
  - .nojekyll
  - .git

# Plug-ins
plugins:
  - jekyll-email-protect
  - jekyll-scholar
  - jekyll-sitemap
  - jemoji

# -----------------------------------------------------------------------------
# Jekyll Scholar
# -----------------------------------------------------------------------------

scholar:

  last_name: Teng
  first_name: [Minggui]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  # Note: if you have latex math in your bibtex, the latex filter
  # preprocessing may conflict with MathJAX if the latter is enabled.
  # See https://github.com/alshedivat/al-folio/issues/357.
  bibtex_filters: [latex, smallcaps, superscript]

  replace_strings: true
  join_strings: true

  query: "@*"

# -----------------------------------------------------------------------------
# Optional Features
# -----------------------------------------------------------------------------

enable_google_analytics:    false  # enables google analytics
enable_panelbear_analytics: false  # enables panelbear analytics
enable_math:                true   # enables math typesetting (uses MathJax)
enable_tooltips:            false  # enables automatic tooltip links generated
                                   # for each section titles on pages and posts
enable_darkmode:            true   # enables switching between light/dark modes
enable_navbar_social:       true  # enables displaying social links in the
                                   # navbar on the about page
enable_medium_zoom:         true   # enables image zoom feature (as on medium.com)

# -----------------------------------------------------------------------------
# Library versions
# -----------------------------------------------------------------------------
# Third-party CSS/JS/fonts are self-hosted under assets/vendor/ (see the
# comments in _includes/head.html). Only MathJax is still loaded from a CDN.

mathjax:
  version: "3.2.0"
